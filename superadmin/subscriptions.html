<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Super Admin · Subscription Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<style>
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:22px;margin-top:20px}
.sm-card{position:relative;background:#fff;border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column}
.sm-card.pop{border-color:var(--teal);box-shadow:0 8px 24px rgba(29,158,117,.14)}
.sm-tag{position:absolute;top:-10px;right:18px;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:100px}
.sm-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sm-name{font-weight:700;font-size:16px}
.sm-aud{font-size:11px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--light);margin-top:3px}
.sm-price{font-size:25px;font-weight:700;color:var(--teal);white-space:nowrap;text-align:right;line-height:1}
.sm-price span{font-size:13px;color:var(--light);font-weight:500}
.sm-subs{font-size:12px;color:var(--light);text-align:right;margin-top:6px}
.sm-feat{display:flex;flex-direction:column;gap:9px;margin:16px 0;font-size:13.5px;color:var(--gray)}
.sm-feat div{display:flex;gap:9px;align-items:center}
.sm-feat .ms{font-size:17px;color:var(--teal)}
.sm-acts{display:flex;justify-content:flex-end;gap:12px;margin-top:auto;padding-top:8px}
.sm-del{background:#fff;border:1px solid var(--border);color:var(--accent)}
.sm-del:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="capp">
  <aside class="c-side">
    <div class="clogo"><img src="../logo-symbol.svg" alt="Tenderfy"></div>
    <a class="cic" href="dashboard.html" title="Dashboard"><span class="ms fill">desktop_mac</span></a>
    <a class="cic" href="companies.html" title="Manage Company"><span class="ms fill">contacts</span></a>
    <a class="cic active" href="subscriptions.html" title="Manage Subscription"><span class="ms fill">credit_card</span></a>
    <a class="cic" data-toast="AI Usage" title="AI Usage"><span class="ms fill">auto_awesome</span></a>
    <a class="cic" href="subcontractors.html" title="Supply Chain"><span class="ms fill">apartment</span></a>
    <a class="cic" data-toast="Manage Files" title="Manage Files"><span class="ms fill">description</span></a>
    <a class="cic" data-toast="Informative Pages" title="Informative Pages"><span class="ms fill">info</span></a>
</aside>
  <div class="c-main">
    <div class="c-header">
      <div class="l"><span class="ms fill" style="font-size:20px">home</span> <span>Subscription Management</span></div>
      <div class="r"><span class="ms fill" data-toast="Settings">settings</span><span class="ms fill" data-toast="Notifications">notifications</span><span class="grp"><span>Andrew Williams</span><span class="cava">AW</span></span></div>
    </div>
    <div class="c-content"><div class="pad">
      <div class="cs-top">
        <div class="h1" style="display:flex;align-items:center;gap:9px"><span style="width:4px;height:22px;background:var(--teal);border-radius:2px"></span>Subscription Management</div>
        <div style="display:flex;gap:12px">
          <a class="btn btn-outline" data-toast="Select a plan to mark as popular">Mark Popular</a>
          <a class="btn btn-primary" onclick="createPlan()"><span class="ms" style="font-size:18px">add</span> Create Subscription</a>
        </div>
      </div>

      <div class="sm-grid" id="smGrid"></div>
    </div></div>
  </div>
</div>
<script src="../app.js"></script>
<script>
const PLANS=[
  {name:'Subbies Free', aud:'Subcontractor', price:0, per:'mo', subs:118, type:'subbie',
   feat:['Quote on invitations','Capability statement preview','5 document uploads','3 documents']},
  {name:'Subbies Premium', aud:'Subcontractor', price:99, per:'mo', subs:58, pop:true, type:'subbie',
   feat:['Capability Statement','Company Documents','Project Library','500 Ray AI tokens / mo','50 document uploads','25 documents']},
  {name:'Starter', aud:'Contractor', price:249, per:'mo', subs:46, type:'contractor',
   feat:['10 Resumes','10 Case Studies','10 Policies','10 Other Documents','2M AI Tokens']},
  {name:'Growth', aud:'Contractor', price:499, per:'mo', subs:61, type:'contractor',
   feat:['50 Resumes','50 Case Studies','50 Policies','50 Other Documents','8M AI Tokens','Supply Chain Module']},
  {name:'Enterprise', aud:'Contractor', price:999, per:'mo', subs:29, type:'contractor',
   feat:['Unlimited templates','100 Case Studies','100 Policies','100 Other Documents','15M AI Tokens','Supply Chain Module']},
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// query strings get stripped by the dev server's clean-URL redirect, so hand off the plan via sessionStorage
function editPlan(i){ sessionStorage.setItem('tf_editPlan', JSON.stringify(PLANS[i])); location.href='edit-subscription.html'; }
function createPlan(){ sessionStorage.removeItem('tf_editPlan'); location.href='edit-subscription.html'; }
function renderPlans(){
  document.getElementById('smGrid').innerHTML=PLANS.map(function(p,i){
    const feats=p.feat.map(f=>`<div><span class="ms">check</span> ${esc(f)}</div>`).join('');
    return `<div class="sm-card ${p.pop?'pop':''}">
      ${p.pop?'<span class="sm-tag">Most popular</span>':''}
      <div class="sm-top">
        <div><div class="sm-name">${esc(p.name)}</div><div class="sm-aud">${esc(p.aud)}</div></div>
        <div><div class="sm-price">$${p.price} <span>/${p.per}</span></div><div class="sm-subs">${p.subs} subscribers</div></div>
      </div>
      <div class="sm-feat">${feats}</div>
      <div class="sm-acts">
        <a class="btn btn-sm sm-del" onclick="delPlan(${i})">Delete</a>
        <a class="btn btn-sm btn-primary" onclick="editPlan(${i})">Edit</a>
      </div>
    </div>`;
  }).join('');
}
function delPlan(i){ if(confirm('Delete the "'+PLANS[i].name+'" subscription?')){ const n=PLANS[i].name; PLANS.splice(i,1); renderPlans(); showToast(n+' subscription deleted'); } }
renderPlans();
console.assert(PLANS.filter(p=>p.pop).length===1,'exactly one popular plan');
</script>
</body>
</html>
