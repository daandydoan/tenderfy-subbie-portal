<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Contractor · Templates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="components.css">
</head>
<body data-page="library" data-title="Templates">
<div id="app-content">
  <div class="pad">
    <div class="pg-head">
      <div>
        <div class="tn-title">Templates</div>
        <div class="pg-sub">Documents built from your <a href="blocks.html" style="color:var(--teal)">blocks</a>. Assign one and an estimator fills in only the parts you marked Editable.</div>
      </div>
      <div class="pg-acts"><a class="btn btn-primary btn-sm" href="document-edit.html#type=section"><span class="ms" style="font-size:18px">add</span> New Template</a></div>
    </div>
    <div class="lst-bar">
      <div class="lst-tabs" id="tabs"></div>
      <span class="lst-search"><span class="ms">search</span><input id="q" placeholder="Search templates…"></span>
    </div>
    <div class="lst-grid" id="grid"></div>
    <div id="empty" style="display:none;text-align:center;color:var(--light);padding:50px 0"><span class="ms" style="font-size:40px">post_add</span><p class="mt16">No templates yet — build one from your blocks.</p></div>
  </div>
</div>
<script src="../app.js"></script>
<script src="client-shell.js"></script>
<script src="library-data.js"></script>
<script src="primitives.js"></script>
<script src="blocks-data.js"></script>
<script src="block-layouts.js"></script>
<script>
const LOCKKEY='tf_clock', ESTIMATORS=['Sam Ortega','Priya Nair'];
function loadLocks(){ try{ return JSON.parse(localStorage.getItem(LOCKKEY))||{}; }catch(e){ return {}; } }
function setLock(id,on){ const l=loadLocks(); if(on) l[id]={by:'Andrew Williams',date:new Date().toISOString().slice(0,10)}; else delete l[id]; localStorage.setItem(LOCKKEY, JSON.stringify(l)); }
function fillOf(id){ try{ return JSON.parse(localStorage.getItem('tf_cfill_'+id)); }catch(e){ return null; } }
function pageInit(){
  const docs=()=>COMPONENTS.filter(c=>c.blocks);   // only what was built here — the seeded library documents have no block structure
  const cats=()=>['All', ...new Set(docs().map(c=>c.category))];
  let activeCat='All', query='';
  function renderTabs(){
    document.getElementById('tabs').innerHTML=cats().map(c=>`<span class="lst-tab ${c===activeCat?'on':''}" data-cat="${c}">${c}</span>`).join('');
    document.querySelectorAll('#tabs .lst-tab').forEach(t=>t.addEventListener('click',()=>{activeCat=t.dataset.cat;renderTabs();renderGrid();}));
  }
  function renderGrid(){
    const locks=loadLocks();
    const list=docs().filter(c=>(activeCat==='All'||c.category===activeCat)&&(!query||(c.name+' '+c.category+' '+(c.desc||'')).toLowerCase().includes(query)));
    document.getElementById('grid').innerHTML=list.map(c=>{ const lk=locks[c.id], f=fillOf(c.id); return `
      <div class="lst-card" data-id="${c.id}">
        <div class="lst-name"><span class="lst-lbl">${c.name}</span><span class="lst-use"><span class="ms" style="font-size:13px;vertical-align:-2px">widgets</span> ${c.blocks.length}</span></div>
        <div class="lst-prev">${blockPreview('paragraph')}</div>
        <div class="lst-desc">${c.desc||c.category}</div>
        <div class="lst-foot">
          ${lk?`<span class="badge b-inreview" title="Locked by ${lk.by} · ${lk.date}"><span class="ms" style="font-size:13px">lock</span> Locked</span>`:''}
          ${f&&f.status==='ready'?`<span class="badge b-published"><span class="b-dot"></span>Ready for PDF</span>`:c.assignedTo?`<span class="badge b-approved"><span class="ms" style="font-size:13px">person</span> ${c.assignedTo}</span>`:`<span class="badge b-draft">Not assigned</span>`}
          <span class="lst-kebwrap">
            <button class="lst-kebab" data-kebab aria-label="Actions"><span class="ms">more_vert</span></button>
            <div class="kebab-menu kebab-up">
              <a data-act="edit"><span class="ms">edit</span> ${lk?'View':'Edit'} structure</a>
              <a data-act="assign"><span class="ms">person_add</span> ${c.assignedTo?'Reassign':'Assign to estimator'}</a>
              <a data-act="fill"><span class="ms">edit_document</span> Open as ${c.assignedTo||'estimator'}</a>
              <div class="kebab-sep"></div>
              <a data-act="lock"><span class="ms">${lk?'lock_open':'lock'}</span> ${lk?'Unlock':'Lock (head office)'}</a>
              <a class="danger" data-act="del"><span class="ms">delete</span> Delete</a>
            </div>
          </span>
        </div>
      </div>`;}).join('');
    document.getElementById('empty').style.display=list.length?'none':'block';
  }
  const grid=document.getElementById('grid');
  grid.addEventListener('click', e=>{
    const kebab=e.target.closest('.lst-kebab');
    if(kebab){ e.preventDefault(); e.stopPropagation();
      const menu=kebab.parentElement.querySelector('.kebab-menu'), isOpen=menu.classList.contains('open');
      grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open'));
      if(!isOpen) menu.classList.add('open'); return; }
    const item=e.target.closest('.kebab-menu a');
    if(item){ e.preventDefault(); e.stopPropagation();
      const card=item.closest('.lst-card'), c=COMPONENTS.find(x=>x.id===card.dataset.id), act=item.dataset.act;
      item.closest('.kebab-menu').classList.remove('open');
      const log=what=>saveCustomDoc(Object.assign({},c,{audit:[...(c.audit||[]),{date:new Date().toISOString().slice(0,16).replace('T',' '),by:'Andrew Williams',what}]}));
      if(act==='edit') location.href='document-edit.html#id='+c.id;
      else if(act==='fill') location.href='document.html#id='+c.id+'&mode=fill';
      else if(act==='assign'){ const i=ESTIMATORS.indexOf(c.assignedTo); const who=ESTIMATORS[(i+1)%ESTIMATORS.length]; c.assignedTo=who; log('Assigned to '+who); renderGrid(); showToast(c.name+' assigned to '+who); }   // ponytail: cycles two seeded estimators; a picker when there is a staff list
      else if(act==='lock'){ const on=!loadLocks()[c.id]; setLock(c.id,on); log(on?'Locked by head office':'Unlocked'); renderGrid(); showToast((on?'Locked':'Unlocked')+': '+c.name); }
      else if(act==='del') confirmAction({title:'Delete this template?', body:c.name+' — estimators lose their fills too.', confirm:'Delete', danger:true}, ()=>{ removeCustomDoc(c.id); localStorage.removeItem('tf_cfill_'+c.id); const i=COMPONENTS.indexOf(c); if(i>=0) COMPONENTS.splice(i,1); renderTabs(); renderGrid(); showToast('Deleted: '+c.name); });
      return; }
    const card=e.target.closest('.lst-card'); if(card) location.href='document.html#id='+card.dataset.id;
  });
  document.addEventListener('click', ()=>grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open')));
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderGrid();});
  renderTabs(); renderGrid();
}
</script>
</body>
</html>
