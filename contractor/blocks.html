<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Contractor · Block Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="components.css">
</head>
<body>
<div class="capp">
  <aside class="c-side">
    <div class="clogo"><img src="../logo-symbol.svg" alt="Tenderfy"></div>
    <a class="cic" data-toast="Contractor dashboard" title="Dashboard"><span class="ms fill">desktop_mac</span></a>
    <a class="cic" href="projects.html" title="Tenders"><span class="ms fill">domain</span></a>
    <a class="cic" data-toast="Messages" title="Messages"><span class="ms fill">chat</span></a>
    <a class="cic active" href="blocks.html" title="Block Library"><span class="ms fill">insert_drive_file</span></a>
    <a class="cic" data-toast="Contacts" title="Contacts"><span class="ms fill">contacts</span></a>
    <a class="cic" data-toast="Manage staff" title="Manage Staff"><span class="ms fill">manage_accounts</span></a>
  </aside>
  <div class="c-main">
    <div class="c-header">
      <div class="l"><span class="ms fill" style="font-size:20px">home</span> <span>Block Library</span></div>
      <div class="r"><a class="ms fill" href="settings.html" title="Settings" style="color:#fff;text-decoration:none">settings</a><span class="ms fill" data-toast="Notifications">notifications</span><span class="grp"><span>Andrew Williams</span><span class="cava">AW</span></span></div>
    </div>
    <div class="c-content"><div class="pad">
      <div class="pg-head">
        <div>
          <div class="tn-title">Block Library</div>
          <div class="pg-sub">Reusable sections for your tenders &mdash; Tenderfy&rsquo;s set plus the ones you build.</div>
        </div>
        <div class="pg-acts" id="pgActs"></div>
      </div>

      <div class="lst-bar">
        <div class="lst-tabs" id="tabs"></div>
        <button class="lst-filterbtn" id="filterToggle"><span class="ms">tune</span> Filters <span class="lst-fcount" id="fcount" style="display:none"></span></button>
      </div>
      <div class="lst-filters" id="filterRow" hidden>
        <span class="lst-search"><span class="ms">search</span><input id="q" placeholder="Search blocks…"></span>
        <div class="lst-pills" id="ownerRow"></div>
      </div>
      <div class="lst-grid" id="grid"></div>
      <div id="empty" style="display:none;text-align:center;color:var(--light);padding:50px 0"><span class="ms" style="font-size:40px">search_off</span><p class="mt16">No blocks match.</p></div>
    </div></div>
  </div>
</div>
<script src="../app.js"></script>
<script src="primitives.js"></script>
<script src="block-layouts.js"></script>
<script src="blocks-data.js"></script>
<script>
// Client-only: head-office lock on a block. Admin has no permissions — "owner decides, estimator obeys".
const LOCKKEY='tf_clock';
function loadLocks(){ try{ return JSON.parse(localStorage.getItem(LOCKKEY))||{}; }catch(e){ return {}; } }
function setLock(id, on){ const l=loadLocks(); if(on) l[id]={by:'Andrew Williams',date:new Date().toISOString().slice(0,10)}; else delete l[id]; localStorage.setItem(LOCKKEY, JSON.stringify(l)); }
const isMine=b=>!!b.client || !!loadCustomBlocks()[b.id];   // seeded Tenderfy blocks have no owner

(function(){
  const cats=[...BLOCK_CATS.filter(c=>COMPOSED_BLOCKS.some(b=>b.cat===c)), 'All Blocks'];   // after custom blocks merge, so a new category gets its tab
  let active=cats[0], owner='all', query='';

  function renderActs(){
    document.getElementById('pgActs').innerHTML = active==='Headers & Footers'
      ? `<a class="btn btn-outline btn-sm" href="block-edit.html#slot=footer"><span class="ms" style="font-size:17px">flip_to_back</span> New footer</a>
         <a class="btn btn-primary btn-sm" href="block-edit.html#slot=header"><span class="ms" style="font-size:17px">flip_to_front</span> New letterhead</a>`
      : `<a class="btn btn-primary btn-sm" href="block-edit.html"><span class="ms" style="font-size:18px">add</span> New Block</a>`;
  }
  function renderTabs(){
    document.getElementById('tabs').innerHTML=cats.map(c=>`<span class="lst-tab ${c===active?'on':''}" data-cat="${c}">${c}</span>`).join('');
    document.querySelectorAll('#tabs .lst-tab').forEach(t=>t.addEventListener('click',()=>{active=t.dataset.cat;renderTabs();renderActs();renderOwnerRow();renderGrid();}));
  }
  const inCat=b=>active==='All Blocks'||b.cat===active;
  const inOwner=b=>owner==='all'||(owner==='mine')===isMine(b);
  function renderOwnerRow(){
    const opts=[['all','All'],['mine','Yours'],['tenderfy','Tenderfy']];
    document.getElementById('ownerRow').innerHTML=opts.map(([k,l])=>{
      const n=COMPOSED_BLOCKS.filter(b=>inCat(b)&&(k==='all'||(k==='mine')===isMine(b))).length;
      return `<span class="lst-pill ${k===owner?'on':''}" data-o="${k}">${l} <span class="n">${n}</span></span>`;
    }).join('');
    document.querySelectorAll('#ownerRow .lst-pill').forEach(c=>c.addEventListener('click',()=>{owner=c.dataset.o;renderOwnerRow();renderGrid();updateFcount();}));
  }
  function renderGrid(){
    const locks=loadLocks();
    const list=COMPOSED_BLOCKS.filter(b=>inCat(b)&&inOwner(b)&&(!query||(b.label+' '+b.desc+' '+b.cat).toLowerCase().includes(query)));
    const g=document.getElementById('grid'); g.classList.remove('tab-in'); void g.offsetWidth; g.classList.add('tab-in');
    g.innerHTML=list.map(b=>{
      const lk=locks[b.id];
      return `
      <div class="lst-card" data-id="${b.id}">
        <div class="lst-name"><span class="lst-lbl">${b.label}</span><span class="lst-use"><span class="ms" style="font-size:13px;vertical-align:-2px">description</span> ${blockUsage(b.id)}</span></div>
        <div class="lst-prev">${blockThumb(b)}</div>
        <div class="lst-desc">${b.desc}</div>
        <div class="lst-foot">
          ${lk?`<span class="badge b-inreview" title="Locked by ${lk.by} · ${lk.date}"><span class="ms" style="font-size:13px">lock</span> Locked</span>`:`<span class="badge b-draft">${isMine(b)?'Yours':'Tenderfy'}</span>`}
          <span class="lst-cat">${b.cat}</span>
          <span class="lst-kebwrap">
            <button class="lst-kebab" data-kebab aria-label="Actions"><span class="ms">more_vert</span></button>
            <div class="kebab-menu kebab-up">
              <a data-act="edit"><span class="ms">edit</span> ${lk?'View':'Edit'}</a>
              <a data-act="dup"><span class="ms">content_copy</span> Duplicate</a>
              <div class="kebab-sep"></div>
              <a data-act="lock"><span class="ms">${lk?'lock_open':'lock'}</span> ${lk?'Unlock':'Lock (head office)'}</a>
            </div>
          </span>
        </div>
      </div>`;}).join('');
    document.getElementById('empty').style.display=list.length?'none':'block';
  }

  const grid=document.getElementById('grid');
  grid.addEventListener('click', e=>{
    const kebab=e.target.closest('.lst-kebab');
    if(kebab){ e.preventDefault(); e.stopPropagation();
      const menu=kebab.parentElement.querySelector('.kebab-menu'), isOpen=menu.classList.contains('open');
      grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open'));
      if(!isOpen) menu.classList.add('open');
      return; }
    const item=e.target.closest('.kebab-menu a');
    if(item){ e.preventDefault(); e.stopPropagation();
      const card=item.closest('.lst-card'), id=card.dataset.id, blk=BLOCKS.find(x=>x.id===id);
      item.closest('.kebab-menu').classList.remove('open');
      if(item.dataset.act==='edit'){ location.href='block-edit.html#id='+id; }
      else if(item.dataset.act==='dup'){ duplicateBlock(blk.label, blk.id); }
      else if(item.dataset.act==='lock'){ const on=!loadLocks()[id]; setLock(id,on); renderGrid(); showToast((on?'Locked':'Unlocked')+': '+blk.label); }
      return; }
    const card=e.target.closest('.lst-card');
    if(card){ location.href='block-edit.html#id='+card.dataset.id; }
  });
  document.addEventListener('click', ()=>grid.querySelectorAll('.kebab-menu.open').forEach(m=>m.classList.remove('open')));
  document.getElementById('q').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();renderGrid();updateFcount();});

  let filtersOpen=false;
  function updateFcount(){
    const n=(owner!=='all'?1:0)+(query?1:0);
    const fc=document.getElementById('fcount'); fc.style.display=n?'':'none'; fc.textContent=n;
    document.getElementById('filterToggle').classList.toggle('on', filtersOpen||n>0);
  }
  document.getElementById('filterToggle').addEventListener('click',()=>{ filtersOpen=!filtersOpen; document.getElementById('filterRow').hidden=!filtersOpen; updateFcount(); });

  renderActs(); renderTabs(); renderOwnerRow(); renderGrid(); updateFcount();
})();
</script>
</body>
</html>
