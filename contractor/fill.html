<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenderfy — Contractor · Fill Template</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="components.css">
<style>
  /* page + canvas rules are the document builder's (document-edit.html inline CSS), copied so the fill view paginates identically */
  .fx{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;height:calc(100vh - 150px);min-height:520px}
  .fx-side{overflow:auto;scrollbar-width:none} .fx-side::-webkit-scrollbar{display:none}
  .vb-canvas{min-height:0;background:#E7ECEA;background-image:radial-gradient(#d4dcd9 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--border);border-radius:14px;padding:24px;overflow:auto}
  .vb-stage{display:flex;flex-direction:column;align-items:center;gap:22px;min-height:100%}
  .vb-page{position:relative;width:620px;min-height:877px;background:#fff;border-radius:4px;box-shadow:0 10px 34px rgba(20,45,38,.14);display:flex;flex-direction:column;overflow:hidden}
  .doc-body{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;padding:36px;min-height:0}
  .pg-num{position:absolute;bottom:8px;right:12px;font-size:10.5px;font-weight:600;color:var(--gray);background:#eef3f1;border-radius:100px;padding:2px 9px;z-index:2}
  /* estimator affordances: only Editable parts respond */
  [data-el]{border-radius:6px;border:1.5px solid transparent;margin:-1.5px}
  [data-el].fx-ed{border-color:color-mix(in srgb,var(--teal) 45%,transparent);border-style:dashed;cursor:text}
  [data-el].fx-ed:focus-within{border-style:solid;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-tint)}
  [data-el].fx-ed [contenteditable]{outline:none;min-width:1ch}
  [data-el].fx-lk{cursor:not-allowed} [data-el].fx-lk:hover{border-color:var(--st-amber-tx);border-style:dotted}
  .fx-list{font-size:12.5px} .fx-list>div{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)} .fx-list>div:last-child{border-bottom:0}
  .fx-list .n{margin-left:auto;color:var(--gray)} .fx-list button{width:26px;height:26px;border:1px solid var(--border);background:#fff;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)} .fx-list button .ms{font-size:16px} .fx-list button:hover{border-color:var(--teal);color:var(--teal)}
  .fx-stat{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--gray)} .fx-stat .ms{font-size:16px;color:var(--teal)}
</style>
</head>
<body data-page="library" data-title="Templates">
<div id="app-content">
  <div class="pad">
    <div class="pg-head">
      <div class="pg-titlerow">
        <a href="templates.html" class="pg-back" title="Back to Templates"><span class="ms">arrow_back</span></a>
        <div><div class="tn-title" id="f-name">Template</div><div class="pg-sub" id="f-sub"></div></div>
      </div>
      <div class="pg-acts">
        <span class="fx-stat" id="f-stat"></span>
        <a class="btn btn-outline btn-sm" id="saveBtn"><span class="ms" style="font-size:17px">save</span> Save</a>
        <a class="btn btn-primary btn-sm" id="readyBtn"><span class="ms" style="font-size:17px">picture_as_pdf</span> Ready for PDF</a>
      </div>
    </div>
    <div class="fx">
      <div class="fx-side">
        <div class="card"><h3 class="ed-h">Fill in</h3>
          <div class="fhint" style="margin:0 0 10px">Dashed parts on the page are yours to change. Everything else was set by <span id="f-owner">the owner</span>.</div>
          <div id="fieldsBox"></div>
        </div>
        <div class="card" id="repeatCard" style="display:none"><h3 class="ed-h">Repeating rows</h3><div class="fhint" style="margin:0 0 6px">Add one per item — an extra row is laid out the way the block repeats.</div><div class="fx-list" id="repeatList"></div></div>
        <div class="card"><h3 class="ed-h">History</h3><div class="fx-list" id="auditList"></div></div>
      </div>
      <div class="vb-canvas"><div class="vb-stage" id="stage"></div></div>
    </div>
  </div>
</div>
<script src="../app.js"></script>
<script src="client-shell.js"></script>
<script>const CLIENT_ID='taylor'; const USER='Sam Ortega';</script>
<script src="library-data.js"></script>
<script src="tenant-data.js"></script>
<script src="primitives.js"></script>
<script src="blocks-data.js"></script>
<script src="block-layouts.js"></script>
<script src="document-render.js"></script>
<script>
// The estimator's view of an assigned template. The template is never written: this page keeps its own
// copy of every block (fork-on-edit, same shape the document builder uses) in tf_cfill_<docId>.
function pageInit(){
  const id=new URLSearchParams(location.hash.slice(1)).get('id');
  const doc=COMPONENTS.find(c=>c.id===id);
  if(!doc){ document.getElementById('stage').innerHTML='<div class="fhint">No template with that id — open one from Templates.</div>'; return; }
  const brand=TENANTS.find(t=>t.id===CLIENT_ID).brand, tenant=TENANTS.find(t=>t.id===CLIENT_ID);
  const clone=x=>JSON.parse(JSON.stringify(x));
  const FKEY='tf_cfill_'+id, A4H=877, PAD=36;
  const bById=Object.fromEntries(BLOCKS.map(b=>[b.id,b]));

  // ---- the fill copy ----
  let fill; try{ fill=JSON.parse(localStorage.getItem(FKEY)); }catch(e){}
  if(!fill){
    fill={status:'draft', merge:{}, blocks:(doc.blocks||[]).map(bl=>{
      if(bl.t==='element'||bl.el) return clone(bl);
      const b=bById[bl.id]; const d=bl.doc?clone(bl.doc):(b?blockDocCopy(b):[]);
      d.forEach(row=>{ if(row.repeat) row.items=[row.cols]; });   // a repeating row starts with one item
      return Object.assign(clone(bl),{doc:d});
    })};
  }
  // A row with items renders as one row per item (Repeat down) or one row of all the items' columns (Repeat across).
  function expand(d){ const out=[]; d.forEach(row=>{ if(!row.items) return out.push(row); if(row.repeat==='h') out.push(Object.assign({},row,{cols:[].concat(...row.items),repeat:undefined,items:undefined,ratio:undefined})); else row.items.forEach(cols=>out.push(Object.assign({},row,{cols,repeat:undefined,items:undefined}))); }); return out; }
  const perm=el=>el.perm||'fixed';
  const fieldKey=el=>el.field||(el.content&&el.content.field)||'client.name';
  const FIELD_LABELS={'client.name':'Client name','client.industry':'Client industry','client.abn':'Client ABN','project.name':'Project name','project.ref':'Tender reference','project.value':'Contract value','date.today':'Today’s date','contact.name':'Contact name'};

  // ---- render ----
  const stage=document.getElementById('stage'), maps=[];
  function blockHtml(bl,i){
    if(bl.t==='element'||bl.el) return docItemHtml(docBlocksToItems([bl])[0], brand, 'pv-blk');
    const ex=expand(bl.doc); maps[i]={}; ex.forEach((row,r)=>row.cols.forEach((col,c)=>col.forEach((el,k)=>{ maps[i][r+'.'+c+'.'+k]=el; })));
    return docItemHtml(Object.assign(docBlocksToItems([bl])[0],{doc:ex}), brand, 'pv-blk').replace('<div class="pv-blk', `<div data-i="${i}" class="pv-blk`);
  }
  function furn(kind){ const bid=doc.topLayer&&doc.topLayer[kind], b=bid&&bById[bid]; return b?`<div style="${kind==='header'?'margin-bottom:22px':'margin-top:auto;padding-top:22px'}">${renderStationery(b.p, brand)}</div>`:''; }
  function render(){
    const head=furn('header'), foot=furn('footer'), blocks=fill.blocks.map(blockHtml);
    // measure real heights, pack into A4 pages (same rule as the builder's Preview)
    const meas=document.createElement('div'); meas.style.cssText=`position:absolute;left:-9999px;top:0;width:620px;box-sizing:border-box;padding:${PAD}px;visibility:hidden`;
    meas.innerHTML=head+blocks.join('')+foot; stage.appendChild(meas);
    const kids=[...meas.children], headH=head?kids[0].getBoundingClientRect().height+22:0, footH=foot?kids[kids.length-1].getBoundingClientRect().height+16:0;
    const hts=kids.slice(head?1:0, foot?kids.length-1:kids.length).map(el=>el.getBoundingClientRect().height+(parseFloat(getComputedStyle(el).marginBottom)||0));
    meas.remove();
    const usable=Math.max(120, A4H-2*PAD-headH-footH); const pages=[]; let cur=[], acc=0;
    blocks.forEach((h,i)=>{ if(cur.length && acc+hts[i]>usable){ pages.push(cur); cur=[]; acc=0; } cur.push(h); acc+=hts[i]; }); if(cur.length||!pages.length) pages.push(cur);
    stage.innerHTML=pages.map((pg,pi)=>`<div class="vb-page"><div class="doc-body">${head}${pg.join('')}${foot}</div><span class="pg-num">Page ${pi+1} / ${pages.length}</span></div>`).join('');
    wire(); renderSide();
    document.getElementById('f-stat').innerHTML=`<span class="ms">${fill.status==='ready'?'task_alt':'edit_note'}</span> ${fill.status==='ready'?'Ready for PDF':'Draft'} · ${pages.length} A4 page${pages.length>1?'s':''}`;
  }
  // Editable parts take focus and write straight back into the fill copy; merge fields show their filled value.
  function wire(){
    stage.querySelectorAll('.pv-blk[data-i] [data-el]').forEach(w=>{
      const el=maps[+w.closest('.pv-blk').dataset.i][w.dataset.el]; if(!el) return;
      if(w.dataset.elid==='field'){ const v=fill.merge[fieldKey(el)]; if(v){ const s=w.querySelector('span'); if(s) s.textContent=v; } return; }
      const p=perm(el); w.classList.toggle('fx-lk', p==='locked'); if(p==='locked') w.title='Locked by head office';
      if(p!=='editable') return;
      w.classList.add('fx-ed');
      w.querySelectorAll('[data-ek]').forEach(n=>{ const ek=n.dataset.ek; if(!/^(title|body|value|label|text|caption|items)$/.test(ek)&&n.tagName!=='LI') return;
        n.contentEditable='true'; n.addEventListener('input',()=>{ el.content=el.content||{};
          if(ek==='items'||n.tagName==='LI'){ const ul=n.closest('ul,ol'); el.content.items=[...ul.querySelectorAll('li')].map(li=>li.innerText); } else el.content[ek]=n.innerText; dirty(); }); });
    });
  }
  // ponytail: table cells and key/value pairs stay read-only in the fill view; add when a template marks one Editable
  function renderSide(){
    const fields={}; fill.blocks.forEach(bl=>(bl.doc||[]).forEach(row=>(row.items||[row.cols]).forEach(cols=>cols.forEach(col=>col.forEach(el=>{ if((el.id||el)==='field'&&perm(el)!=='locked') fields[fieldKey(el)]=1; })))));
    const keys=Object.keys(fields);
    document.getElementById('fieldsBox').innerHTML = keys.length ? keys.map(k=>`<div class="fld"><label>${FIELD_LABELS[k]||k}</label><input class="fin" data-merge="${k}" value="${(fill.merge[k]||'').replace(/"/g,'&quot;')}" placeholder="${FIELD_LABELS[k]||k}"></div>`).join('') : '<div class="fhint">No merge fields in this template.</div>';
    document.querySelectorAll('[data-merge]').forEach(inp=>inp.addEventListener('change',()=>{ fill.merge[inp.dataset.merge]=inp.value.trim(); dirty(); render(); }));
    const reps=[]; fill.blocks.forEach((bl,i)=>(bl.doc||[]).forEach((row,r)=>{ if(row.items) reps.push({bl,i,row,r}); }));
    document.getElementById('repeatCard').style.display=reps.length?'':'none';
    document.getElementById('repeatList').innerHTML=reps.map(({bl,i,row,r})=>`<div><span class="ms" style="font-size:16px;color:var(--teal)">${row.repeat==='h'?'view_column':'table_rows'}</span>${(bById[bl.id]||{}).label||'Block'} · row ${r+1}<span class="n">${row.items.length} item${row.items.length>1?'s':''}</span><button data-rep="${i}.${r}" data-op="-" title="Remove last item"><span class="ms">remove</span></button><button data-rep="${i}.${r}" data-op="+" title="Add another item"><span class="ms">add</span></button></div>`).join('');
    document.querySelectorAll('[data-rep]').forEach(b=>b.addEventListener('click',()=>{ const [i,r]=b.dataset.rep.split('.').map(Number), row=fill.blocks[i].doc[r];
      if(b.dataset.op==='+') row.items.push(clone(row.items[row.items.length-1]));   // a new item starts as a copy of the last one
      else if(row.items.length>1) row.items.pop(); dirty(); render(); }));
    document.getElementById('auditList').innerHTML=(doc.audit||[]).slice().reverse().map(a=>`<div><div><div style="font-weight:600">${a.what}</div><div class="fhint" style="margin:0">${a.by} · ${a.date}</div></div></div>`).join('')||'<div class="fhint">No changes logged yet.</div>';
  }
  let dirtyT; function dirty(){ clearTimeout(dirtyT); dirtyT=setTimeout(()=>localStorage.setItem(FKEY, JSON.stringify(fill)),400); }
  function log(what){ const rec=Object.assign({},doc,{audit:[...(doc.audit||[]),{date:new Date().toISOString().slice(0,16).replace('T',' '),by:USER,what}]}); saveCustomDoc(rec); Object.assign(doc,rec); }
  document.getElementById('saveBtn').addEventListener('click',()=>{ localStorage.setItem(FKEY, JSON.stringify(fill)); log('Filled · '+Object.keys(fill.merge).filter(k=>fill.merge[k]).length+' fields'); showToast('Saved your changes'); renderSide(); });
  document.getElementById('readyBtn').addEventListener('click',()=>{ fill.status='ready'; localStorage.setItem(FKEY, JSON.stringify(fill)); log('Marked ready for PDF'); showToast('Queued for PDF — the backend renders it from this exact layout'); render(); });

  document.getElementById('f-name').textContent=doc.name; document.getElementById('f-sub').textContent=(doc.desc||doc.category||'')+' · '+tenant.name; document.getElementById('f-owner').textContent='Andrew Williams';
  render();
}
</script>
</body>
</html>
